<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Header & Page Sort — Trello Power-Up connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
/* ============================================================
   Header & Page Sort — a tiny Trello Power-Up
   1) "Add header" board button: colored full-cover header card,
      finds-or-creates the matching (color+name) label.
   2) "Sort Backlog by Epic" board button + "Section order" list
      sorter: sections keyed by label color+name pair, header on
      top of each section, unlabeled cards last.
   3) Live badge on header cards: count of cards in its section.
   ============================================================ */

var APP_KEY  = 'e82ae5688936d7c67aef05819e8fb1c9';
var APP_NAME = 'Header & Page Sort';

var COLOR_ORDER = ['green', 'yellow', 'purple', 'orange', 'red', 'blue', 'sky', 'lime', 'pink', 'black'];

function isHeader(card) {
  var n = (card.name || '').trim();
  return n.length > 0 && n.length <= 40 && n === n.toUpperCase() && /[A-Z]/.test(n);
}

function colorRank(color) {
  var base = (color || '').replace(/_(light|dark)$/, '');
  var i = COLOR_ORDER.indexOf(base);
  return i === -1 ? COLOR_ORDER.length : i;
}

/* Primary label of a card = its label that sorts first by (color, name). */
function primaryLabel(card) {
  var labels = (card.labels || []).slice();
  if (!labels.length) return null;
  labels.sort(function (a, b) {
    var ca = colorRank(a.color), cb = colorRank(b.color);
    if (ca !== cb) return ca - cb;
    return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
  });
  return labels[0];
}

/* Compare two cards into (color, name) sections; header tops its section. */
function sectionCompare(a, b) {
  var la = primaryLabel(a), lb = primaryLabel(b);
  var ca = la ? colorRank(la.color) : 999, cb = lb ? colorRank(lb.color) : 999;
  if (ca !== cb) return ca - cb;
  var na = la ? (la.name || '').toLowerCase() : '';
  var nb = lb ? (lb.name || '').toLowerCase() : '';
  if (na !== nb) return na.localeCompare(nb);
  var ha = isHeader(a) ? 0 : 1, hb = isHeader(b) ? 0 : 1;
  if (ha !== hb) return ha - hb;
  return a.pos - b.pos;
}

window.TrelloPowerUp.initialize({

  'list-sorters': function (t) {
    return [{
      text: 'Section order (headers on top)',
      callback: function (t, opts) {
        var sorted = opts.cards.slice().sort(sectionCompare);
        return { sortedIds: sorted.map(function (c) { return c.id; }) };
      }
    }];
  },

  'board-buttons': function (t) {
    return [{
      icon: {
        dark:  'https://badburo.github.io/header-powerup/icon-dark.png',
        light: 'https://badburo.github.io/header-powerup/icon-light.png'
      },
      text: 'Add header',
      callback: function (t) {
        return t.popup({ title: 'Add a header card', url: './add-header.html', height: 260 });
      }
    }, {
      icon: {
        dark:  'https://badburo.github.io/header-powerup/icon-sort-dark.png',
        light: 'https://badburo.github.io/header-powerup/icon-sort-light.png'
      },
      text: 'Sort Backlog by Epic',
      callback: function (t) {
        return t.popup({ title: 'Sort Backlog by Epic', url: './sort-list.html', height: 190 });
      }
    }];
  },

  'card-badges': function (t) {
    function sectionCount(me, cards) {
      var label = primaryLabel(me); /* null => the unassigned header */
      return cards.filter(function (c) {
        if (c.idList !== me.idList || c.id === me.id) return false;
        if (isHeader(c)) return false;
        if (label) {
          return (c.labels || []).some(function (l) { return l.id === label.id; });
        }
        return (c.labels || []).length === 0;
      }).length;
    }
    return t.card('id', 'name', 'labels', 'idList')
      .then(function (me) {
        if (!isHeader(me)) return [];
        return t.cards('id', 'name', 'labels', 'idList').then(function (cards) {
          var n = sectionCount(me, cards);
          return [{
            text: n + ' in section',
            color: n > 0 ? 'blue' : null
          }];
        });
      })
      .catch(function (e) {
        /* Diagnostic: surface the failure as a red badge. */
        return [{ text: 'ERR ' + String((e && e.message) || e).slice(0, 30), color: 'red' }];
      });
  }

}, {
  appKey: APP_KEY,
  appName: APP_NAME
});
</script>
</body>
</html>
