name: Recount headers
on:
  repository_dispatch:
    types: [trello-recount]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  recount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/recount.js
        env:
          TRELLO_KEY: e82ae5688936d7c67aef05819e8fb1c9
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD_ID: 6a67f5ebd2786dc0a5c36373

